name: CI

on:
  push:
    branches: [main, "audit/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest
        env:
          # The suite is fully mocked/offline, but importing config requires these
          # to be present (they are never used to make real calls in tests).
          FRESHSERVICE_DOMAIN: example
          FRESHSERVICE_API_KEY: dummy
          OPENAI_API_KEY: dummy
